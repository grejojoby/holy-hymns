<p dir="ltr">Hridayathalamenthi nadha<br>
Vannidunnu sannidhe<br>
Kazchayay ninte munnil<br>
Ninnidunnu saadaram</p>
<p dir="ltr">Poornamay nalkidunnu<br>
Bhaktiyaarnu njangale<br>
Nanmapoorna palaka<br>
Innekane nin darshanam</p>
<p dir="ltr">Njangalil prasadamaarnu<br>
Divyadanamayi nee<br>
Snehamarnu kaikal neetti<br>
Sweekarikka kazchakal</p>
