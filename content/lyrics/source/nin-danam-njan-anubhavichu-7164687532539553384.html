<div dir="ltr" style="text-align: left;" trbidi="on">
<div style="padding: 0px 0px 10px;">
<span style="font-family: inherit;">Nin dhanam njan anubhavichu<br />Nin sneham njan ruchicharinju<br />Yeshuve en dhaivame<br />Neeyennum mathiyayaven</span></div>
<div style="padding: 0px 0px 10px;">
<span style="font-family: inherit;">Yeshu enikku chaitha<br />Nanmakalorthidumbol<br />Nandhikonden manam paadidume<br />Sthothra’gaanathin pallavikal</span></div>
<div style="padding: 0px 0px 10px;">
<span style="font-family: inherit;">Daivame ninte sneham<br />Etranaal thalli neeki<br />Annu njan anyayai anadhayai<br />Ennal inno njan dhanyayai</span></div>
</div>
